name: Pantau Endpoint Harga Emas

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  pantau-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Periksa endpoint harga emas
        run: vendor/bin/pest --filter=harga_emas_endpoint_publik
        env:
          RUN_EXTERNAL_GOLD_API_TEST: '1'
          HARGA_EMAS_URL: https://logam-mulia-api.iamutaki.workers.dev/api/prices/anekalogam
