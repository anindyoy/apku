name: Pantau Endpoint Harga Emas

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  pantau-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Periksa endpoint harga emas
        run: vendor/bin/pest --filter=harga_emas_endpoint_publik
        env:
          RUN_EXTERNAL_GOLD_API_TEST: '1'
          HARGA_EMAS_URL: https://logam-mulia-api.iamutaki.workers.dev/api/prices/anekalogam

  bersihkan-riwayat:
    needs: pantau-endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Hapus run sukses lama
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const { data: current } = await github.rest.actions.getWorkflowRun({
              ...repo, run_id: context.runId,
            });
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: current.workflow_id, status: 'success', per_page: 100,
            });
            for (const run of runs) {
              if (run.id >= context.runId || run.workflow_id !== current.workflow_id ||
                  run.status !== 'completed' || run.conclusion !== 'success') continue;
              await github.rest.actions.deleteWorkflowRun({ ...repo, run_id: run.id });
              core.info(`Run sukses lama ${run.id} telah dihapus.`);
            }
